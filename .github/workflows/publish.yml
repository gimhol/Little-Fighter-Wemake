name: Publish to lf.gim.ink

# 独立发布入口：只上传、不构建。产物复用 tag 那次成功构建（见 .github/actions/restore-build）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布哪个 tag 的产物（留空 = v<package.json 版本>）；必须已有成功构建
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # deploy 脚本要用 fdeploy（@fimagine/frontend_deployer）与 ali-oss
      - name: Install dependencies
        run: npm ci

      # dist 与 release/installer 都要，脚本按这两个路径上传
      - name: Restore build artifacts
        uses: ./.github/actions/restore-build
        with:
          reuse: true
          tag: ${{ inputs.tag }}
          dist: true
          installer: true

      - name: Write deploy credentials
        env:
          DEPLOYER_PRIVATE_JSON5: ${{ secrets.DEPLOYER_PRIVATE_JSON5 }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_JSON5" ]; then
            echo "::error::缺少仓库 secret DEPLOYER_PRIVATE_JSON5（内容 = deployer.private.json5 的全文）"
            exit 1
          fi
          printf '%s\n' "$DEPLOYER_PRIVATE_JSON5" > deployer.private.json5

      - name: Publish web frontend to lf.gim.ink/<version>/
        run: npm run deploy

      - name: Publish latest.json
        run: node scripts/deploy-latest.mjs

      - name: Publish installer to lf.gim.ink/desktop/
        run: node scripts/deploy-installer.mjs
