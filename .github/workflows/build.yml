name: Build

# 唯一会构建的 workflow。手动触发的运行跑在 main 上（head_sha 不是 tag 的提交），
# 所以用运行名带上 tag，让之后的手动发布能按 tag 找回这次构建
run-name: ${{ github.event_name == 'workflow_dispatch' && format('build {0}', inputs.tag) || github.event.head_commit.message || github.ref_name }}

on:
  # 打 v* tag（如 v0.1.56-preview-1）时自动构建并发布 GitHub Release；正式版本 tag（不含 -）另外发 Pages
  push:
    tags:
      - "v*"
  # 手动触发 = 为指定 tag 构建一次并上传产物，不发布。发布走各自 workflow 的手动入口，产物按 tag 复用
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建哪个 tag（必填，例如 v0.1.67-preview-2）
        required: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_TAG: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v7
        with:
          # 手动构建时检出 tag 指向的提交；其余情况留空，checkout 会回退到本次触发的 ref
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Ensure electron binary
        run: |
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            node node_modules/electron/install.js
          }

      # Windows runner 没预装 ffmpeg / imagemagick（数据转换与包内转换器都要用）
      - name: Install ffmpeg & imagemagick
        run: |
          choco install ffmpeg imagemagick -y --no-progress
          $has_ff = [bool](Get-Command ffmpeg -ErrorAction SilentlyContinue)
          $has_magick = [bool](Get-Command magick -ErrorAction SilentlyContinue)
          if (-not $has_ff) {
            $f = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { "FFMPEG_PATH=$($f.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append; $has_ff = $true }
          }
          if (-not $has_magick) {
            $m = Get-ChildItem "C:\Program Files\ImageMagick-*\magick.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($m) { "MAGICK_PATH=$($m.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append; $has_magick = $true }
          }
          if (-not ($has_ff -and $has_magick)) { throw "ffmpeg / magick 未就绪" }
          Write-Host "ffmpeg / magick OK"

      - name: Build tool
        run: npm run build:tool

      # 数据包在仓库里是 gitignore 的，CI 检出后必须现场重建
      - name: Build game data
        run: |
          npm run build:data
          npm run build:prel

      - name: Build app
        run: npm run build

      # Pages 与 Release 复用同一次构建。之所以不再用 ubuntu：`apt install imagemagick` 装的是
      # IM6（只有 convert），而工具默认调 IM7 的 `magick`，会让数据包整批缺贴图（见 0.1.56 那次事故）
      - name: Prepare Pages artifact
        run: New-Item -ItemType File -Path dist/.nojekyll -Force | Out-Null

      - name: Upload Pages artifact
        # 万一 Windows 上打 tar 出问题，也不应该连累后面的安装包与 Release
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Build desktop installer & portable zip (NSIS)
        run: node scripts/build-installer.mjs --no-build

      - name: Build desktop portable zip (Bilibili playable)
        run: node scripts/build-desktop.mjs --no-build

      # 从 dist 目录内打包，压缩包不带顶层目录
      - name: Archive web dist (7z)
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $7z = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $7z) { $7z = "C:\Program Files\7-Zip\7z.exe" }
          Push-Location dist
          try {
            & $7z a "../release/Little Fighter Wemake Web v$version.7z" "*"
            if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
          } finally {
            Pop-Location
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: |
            release/installer/*
            release/Little Fighter Wemake_*.zip
            release/Little Fighter Wemake Web v*.7z
          retention-days: 14

  # —— 下面两个只是 tag 推送时的自动发布（调用可复用工作流）；手动发布走各自 workflow 的手动入口 ——

  # 发布 GitHub Release：tag 推送时自动执行
  release:
    name: Publish GitHub Release
    needs: build
    # build 只在 tag 推送时跑，手动触发时它是 skipped，所以这里判 !failure() 而不是 == 'success'
    if: ${{ !cancelled() && !failure() && github.event_name != 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}

  # 发布 GitHub Pages：tag 推送时自动发正式版本（tag 不含 -），预览 tag 跳过；
  # 手动发布请直接触发 Publish GitHub Pages 那个 workflow
  pages:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ !cancelled() && !failure() && github.event_name != 'workflow_dispatch' && !contains(github.ref_name, '-') }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
