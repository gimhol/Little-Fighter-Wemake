name: Build

on:
  # 打 v* tag（如 v0.1.56-preview-1）时自动构建并发布 GitHub Release
  push:
    tags:
      - "v*"
  # 手动触发：可指定 tag，并勾选是否同时发布到 lf.gim.ink
  workflow_dispatch:
    inputs:
      tag:
        description: 发布用的 tag（留空 = v<package.json 版本>；不存在时基于当前分支创建）
        required: false
        default: ""
      publish:
        description: 同时发布到 lf.gim.ink（前端 <version>/ + latest.json + desktop/ 安装包）
        type: boolean
        default: false
      dry_run:
        description: 配合 publish：只打印上传命令，不真的上传（不需要 secret）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_TAG: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Ensure electron binary
        run: |
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            node node_modules/electron/install.js
          }

      # Windows runner 没预装 ffmpeg / imagemagick（数据转换与包内转换器都要用）
      - name: Install ffmpeg & imagemagick
        run: |
          choco install ffmpeg imagemagick -y --no-progress
          $has_ff = [bool](Get-Command ffmpeg -ErrorAction SilentlyContinue)
          $has_magick = [bool](Get-Command magick -ErrorAction SilentlyContinue)
          if (-not $has_ff) {
            $f = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { "FFMPEG_PATH=$($f.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append; $has_ff = $true }
          }
          if (-not $has_magick) {
            $m = Get-ChildItem "C:\Program Files\ImageMagick-*\magick.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($m) { "MAGICK_PATH=$($m.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append; $has_magick = $true }
          }
          if (-not ($has_ff -and $has_magick)) { throw "ffmpeg / magick 未就绪" }
          Write-Host "ffmpeg / magick OK"

      - name: Build tool
        run: npm run build:tool

      # 数据包在仓库里是 gitignore 的，CI 检出后必须现场重建
      - name: Build game data
        run: |
          npm run build:data
          npm run build:prel

      - name: Build app
        run: npm run build

      # Pages 与 Release 复用同一次构建。之所以不再用 ubuntu：`apt install imagemagick` 装的是
      # IM6（只有 convert），而工具默认调 IM7 的 `magick`，会让数据包整批缺贴图（见 0.1.56 那次事故）
      - name: Prepare Pages artifact
        run: New-Item -ItemType File -Path dist/.nojekyll -Force | Out-Null

      - name: Upload Pages artifact
        # 万一 Windows 上打 tar 出问题，也不应该连累后面的安装包与 Release
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Build desktop installer & portable zip (NSIS)
        run: node scripts/build-installer.mjs --no-build

      - name: Build Bilibili playable zip
        run: node scripts/build-bili-playable.mjs --no-build

      # 从 dist 目录内打包，压缩包不带顶层目录
      - name: Archive web dist (7z)
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $7z = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $7z) { $7z = "C:\Program Files\7-Zip\7z.exe" }
          Push-Location dist
          try {
            & $7z a "../release/Little Fighter Wemake Web v$version.7z" "*"
            if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
          } finally {
            Pop-Location
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: |
            release/installer/*
            release/Little Fighter Wemake_*.zip
            release/Little Fighter Wemake Web v*.7z
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_type == 'tag' && github.ref_name || '' }}" }
          if (-not $tag) { $tag = "v$version" }
          if ($tag -notlike "v$version*") { Write-Host "::warning::tag $tag 与 package.json 版本 $version 不一致" }

          $release_args = @("--title", $tag)
          $notes = "docs/changelog/v$version/zh.md"
          if (Test-Path $notes) {
            $body = (Get-Content $notes | Select-Object -Skip 6) -join "`n"
            Set-Content -Path "release/notes.md" -Value $body -Encoding utf8
            $release_args += @("--notes-file", "release/notes.md")
          } else {
            $release_args += "--generate-notes"
          }

          $files = @(Get-ChildItem "release/installer" -File | ForEach-Object FullName)
          $files += (Get-Item "release/Little Fighter Wemake_$version.zip").FullName
          $files += (Get-Item "release/Little Fighter Wemake Web v$version.7z").FullName

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            if ($tag -match "preview") { $release_args += "--prerelease" }
            gh release create $tag $release_args $files
          } else {
            gh release upload $tag $files --clobber
          }

      # ---- 以下为 lf.gim.ink 发布：仅 workflow_dispatch 勾选 publish 时跑（本地等价：npm run deploy / deploy:latest / deploy:installer）----
      - name: Write deploy credentials
        if: ${{ inputs.publish && !inputs.dry_run }}
        env:
          DEPLOYER_PRIVATE_JSON5: ${{ secrets.DEPLOYER_PRIVATE_JSON5 }}
        run: |
          if (-not $env:DEPLOYER_PRIVATE_JSON5) { throw "缺少仓库 secret DEPLOYER_PRIVATE_JSON5（内容 = deployer.private.json5 的全文）" }
          Set-Content -Path deployer.private.json5 -Value $env:DEPLOYER_PRIVATE_JSON5 -Encoding utf8

      # dry_run 走环境变量：`npm run deploy -- --dry` 里的 --dry 会被 npm 吞掉
      - name: Publish web frontend to lf.gim.ink/<version>/
        if: ${{ inputs.publish }}
        env:
          DEPLOY_DRY: ${{ inputs.dry_run && '1' || '' }}
        run: npm run deploy

      - name: Publish latest.json
        if: ${{ inputs.publish }}
        run: node scripts/deploy-latest.mjs ${{ inputs.dry_run && '--dry' || '' }}

      - name: Publish installer to lf.gim.ink/desktop/
        if: ${{ inputs.publish }}
        run: node scripts/deploy-installer.mjs ${{ inputs.dry_run && '--dry' || '' }}

  pages:
    name: Deploy to GitHub Pages
    needs: build
    # 正式版本 tag 或手动触发才发 Pages（预览 tag 跳过），与原来 deploy-pages.yml 的行为一致
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
