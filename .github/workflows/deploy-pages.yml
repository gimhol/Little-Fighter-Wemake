name: Deploy to GitHub Pages

on:
  # 打正式版本 tag（如 v0.1.56）时自动跑；预览 tag（v0.1.56-preview-1）会跳过，见 jobs.build.if
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 允许 deploy-pages 写 Pages 环境
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 预览 tag 名字里带 '-'（v0.1.56-preview-1）只发 GitHub Release，不再跟着发 Pages；手动触发总是跑
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          # 不指定 ref：默认检出触发本次运行的 ref（打 tag 时即该 tag），不再固定 main
          fetch-depth: 0
          fetch-tags: true
          # 仓库所有 *.png/*.wav/*.zip 等用 Git LFS 管理，必须拉取真实内容，否则构建出的资源是损坏的
          lfs: true

      # 检出触发本次运行的 ref 上最近一个含 tag 的提交来构建；没有 tag 时退回该 ref 的最新提交
      - name: Checkout latest tagged commit
        run: |
          if ! TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "::warning::No tag found, building from latest commit"
            TAG=""
          else
            echo "Building from tag: $TAG"
            git checkout "$TAG"
            git lfs pull
          fi
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub runner 默认没有 ffmpeg（音频转 MP3 需要），一并装 imagemagick（BMP 转 PNG）
      - name: Install ffmpeg & imagemagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      # 编译 tool 工具（供 make-data-zip / make-prel 使用）
      - name: Build tool
        run: npm run build:tool

      # 从 lf2s/origin 生成 public/data.zip(.json) 与 public/prel.zip(.json)
      - name: Build game data
        run: npm run build:data

      - name: Build prel data
        run: npm run build:prel

      # tsc -b && vite build -> dist/
      - name: Build app
        run: npm run build

      # 防止 Jekyll 忽略下划线开头的文件/目录
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4+ 默认不打包隐藏文件，需要显式保留 .nojekyll
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
