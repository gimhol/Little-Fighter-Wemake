<html>

<head>
  <title>redirecting to latest version...</title>
  <style>
    html {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body>
  <div id="msg">
  </div>
  <script>
    function append_msg(msg) {
      const el_container = document.getElementById('msg');
      const el_msg_row = document.createElement('div')
      el_msg_row.innerHTML = msg;
      el_container.append(el_msg_row);
    }
    const LATEST_URL = 'https://lf.gim.ink/latest.json';
    // 带上 commit（无 commit 时退回 stamp），避免复用旧版本的缓存页面
    function to_version_url(info) {
      const cache_key = info.commit
        ? `${info.commit}${info.dirty ? '-dirty' : ''}`
        : (info.stamp || Date.now());
      return `https://lf.gim.ink/${info.version}?commit=${cache_key}`;
    }
    const url = `${LATEST_URL}?time=${Date.now()}`
    append_msg(`loading: ${url}`)
    fetch(url, { cache: 'no-store' })
      .then(r => r.json())
      .then(r => {
        if (!r || !r.version) throw new Error(`latest.json 缺少 version: ${JSON.stringify(r)}`)
        const target = to_version_url(r)
        append_msg(`redirecting: ${target}`)
        location.replace(target)
      })
      .catch(e => append_msg(`failed: ${e}`))
  </script>
</body>
</html>
